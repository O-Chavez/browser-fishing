<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lakeside — Cozy Multiplayer Fishing Game in Your Browser</title>
  <meta name="description" content="Lakeside is a free, cozy multiplayer fishing game you play in your browser. Catch fish, sell your haul for better bait and rods, fill your Fishdex and try your luck at the casino with other players. No download needed." />
  <link rel="canonical" href="https://browser-fishing-1.onrender.com/" />
  <meta name="theme-color" content="#2a1b0f" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lakeside" />
  <meta property="og:title" content="Lakeside — Cozy Multiplayer Fishing Game" />
  <meta property="og:description" content="Catch fish, sell your haul for better bait, fill your Fishdex and visit the casino with other players. Free in your browser." />
  <meta property="og:url" content="https://browser-fishing-1.onrender.com/" />
  <meta property="og:image" content="https://browser-fishing-1.onrender.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A wooden fishing dock on a lake at sunset, surrounded by pine trees and mountains" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lakeside — Cozy Multiplayer Fishing Game" />
  <meta name="twitter:description" content="Catch fish, sell your haul for better bait, fill your Fishdex and visit the casino with other players. Free in your browser." />
  <meta name="twitter:image" content="https://browser-fishing-1.onrender.com/og-image.jpg" />

  <script type="application/ld+json">
    { "@context": "https://schema.org", "@type": "VideoGame", "name": "Lakeside", "url": "https://browser-fishing-1.onrender.com/",
      "description": "A free, cozy multiplayer fishing game you play in your browser.", "genre": ["Fishing", "Casual", "Multiplayer"],
      "gamePlatform": "Web browser", "applicationCategory": "Game", "operatingSystem": "Any",
      "image": "https://browser-fishing-1.onrender.com/og-image.jpg", "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="crosshair"></div>
  <canvas id="gauge" width="420" height="420"></canvas>
  <div id="alert" class="hidden">!</div>

  <div id="hud">
    <div id="hud-tl">
      <div id="lvl" title="Level">
        <svg viewBox="0 0 58 58" aria-hidden="true"><circle class="track" cx="29" cy="29" r="25" /><circle id="xpring" cx="29" cy="29" r="25" /></svg>
        <b id="level">1</b><small>LV</small>
      </div>
      <div id="purse"><span class="coin"></span><b id="coins">0</b></div>
      <div id="chipbox" class="hidden"><span class="chipicon">🎰</span><b id="chips">0</b></div>
    </div>
    <div id="chat"></div>
    <div id="ctx"><div id="spot"></div><div id="nightchip"></div></div>
    <div id="prompt" class="hidden"></div>
    <div id="tablehud" class="hidden"></div>
    <div id="tableresult" class="hidden"></div>
    <div id="toast"></div>
    <div id="tip" class="hidden"></div>
    <div id="wheelres"></div>
    <div id="heldname"></div>
    <div id="hotbar"></div>
    <div id="help"><span><kbd>Tab</kbd>Bag</span><span><kbd>Enter</kbd>Chat</span><span><kbd>Esc</kbd>Menu</span></div>
  </div>

  <div id="catch" class="hidden"></div>
  <div id="banner" class="hidden"></div>

  <div id="resume" class="hidden"></div>
  <div id="menu" class="hidden">
    <div class="win">
      <header class="win-bar">
        <div class="who" id="menu-who"></div>
        <nav class="tabs" id="menu-tabs"></nav>
        <button class="close" data-act="close" title="Close (Esc)"><kbd>Esc</kbd><span class="x">✕</span></button>
      </header>
      <div id="tab" class="sheet"></div>
    </div>
  </div>

  <div id="join" class="hidden">
    <div class="panel join">
      <h1>Lakeside</h1>
      <p class="muted">Pick a name and a color. Other anglers will see you this way.</p>
      <div class="split">
        <div id="join-preview"></div>
        <div class="grow">
          <label for="join-name">Name</label>
          <input id="join-name" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Your name" />
          <label>Body color</label>
          <div id="join-colors" class="swatches"></div>
          <p id="join-msg" class="joinmsg"></p>
          <button id="join-go" class="primary">Join the lake</button>
          <button id="join-switch" class="linklike hidden">Not you? Switch account</button>
          <button id="join-offline" class="linklike">or play offline</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
