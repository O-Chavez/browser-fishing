<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lakeside — Cozy Multiplayer Fishing Game in Your Browser</title>
  <meta name="description" content="Lakeside is a free, cozy multiplayer fishing game you play in your browser. Catch fish, sell your haul for better bait and rods, fill your Fishdex and try your luck at the casino with other players. No download needed." />
  <link rel="canonical" href="https://browser-fishing-1.onrender.com/" />
  <meta name="theme-color" content="#2a1b0f" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- The home screen's backdrop (#join in src/style.css), fetched before the stylesheet asks for it. -->
  <link rel="preload" as="image" href="/src/assets/images/home-backdrop.jpg" />
  <!-- Opened from the Home Screen, the game runs like an app without the browser's bars (src/game/homescreen.ts). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Lakeside" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Lakeside" />
  <meta property="og:title" content="Lakeside — Cozy Multiplayer Fishing Game" />
  <meta property="og:description" content="Catch fish, sell your haul for better bait, fill your Fishdex and visit the casino with other players. Free in your browser." />
  <meta property="og:url" content="https://browser-fishing-1.onrender.com/" />
  <meta property="og:image" content="https://browser-fishing-1.onrender.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A wooden fishing dock on a lake at sunset, surrounded by pine trees and mountains" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lakeside — Cozy Multiplayer Fishing Game" />
  <meta name="twitter:description" content="Catch fish, sell your haul for better bait, fill your Fishdex and visit the casino with other players. Free in your browser." />
  <meta name="twitter:image" content="https://browser-fishing-1.onrender.com/og-image.jpg" />

  <script type="application/ld+json">
    { "@context": "https://schema.org", "@type": "VideoGame", "name": "Lakeside", "url": "https://browser-fishing-1.onrender.com/",
      "description": "A free, cozy multiplayer fishing game you play in your browser.", "genre": ["Fishing", "Casual", "Multiplayer"],
      "gamePlatform": "Web browser", "applicationCategory": "Game", "operatingSystem": "Any",
      "image": "https://browser-fishing-1.onrender.com/og-image.jpg", "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="spray"></canvas>
  <div id="vignette"></div>
  <div id="crosshair"></div>
  <canvas id="gauge" width="420" height="420"></canvas>
  <div id="alert" class="hidden">!</div>

  <div id="offline" class="hidden"><span><b id="offline-why"></b><small id="offline-what">Playing offline: progress here isn't saved to your account.</small></span><button id="offline-go" class="btn">Refresh to reconnect</button></div>
  <div id="hud">
    <div id="hud-tl">
      <div id="lvl" title="Level">
        <svg viewBox="0 0 58 58" aria-hidden="true"><circle class="track" cx="29" cy="29" r="25" /><circle id="xpring" cx="29" cy="29" r="25" /></svg>
        <b id="level">1</b><small>LV</small>
      </div>
      <div id="purse"><span class="coin"></span><b id="coins">0</b></div>
      <div id="chipbox" class="hidden"><span class="chipicon">🎰</span><b id="chips">0</b></div>
    </div>
    <div id="divehud" class="hidden"></div>
    <div id="divetag" class="hidden"></div>
    <div id="fishtag" class="hidden"></div>
    <div id="chat"></div>
    <div id="ctx"><div id="spot"></div><div id="nightchip"></div><div id="lurechip"></div><div id="buffs"></div></div>
    <div id="prompt" class="hidden"></div>
    <div id="tablehud" class="hidden"></div>
    <div id="tableresult" class="hidden"></div>
    <div id="verdict" class="hidden"></div>
    <div id="guide"></div>
    <div id="heldname"></div>
    <div id="hotbar"></div>
    <div id="seagear" class="hidden"></div>
    <div id="help"><span><kbd>F</kbd>Emotes</span><span><kbd>Tab</kbd>Bag</span><span><kbd>Enter</kbd>Chat</span><span><kbd>Esc</kbd>Menu</span></div>
  </div>

  <div id="emotewheel" class="hidden"></div>
  <div id="catch" class="hidden"></div>
  <div id="banner" class="hidden"></div>
  <div id="castoff" class="hidden">
    <div class="panel">
      <h2 id="castoff-title"></h2>
      <p id="castoff-where" class="where"></p>
      <p id="castoff-line" class="line"></p>
    </div>
  </div>

  <div id="devprompt" class="hidden">
    <div class="panel" role="dialog" aria-labelledby="devprompt-title">
      <h2 id="devprompt-title"></h2>
      <div id="devprompt-fields"></div>
      <p id="devprompt-msg" class="joinmsg"></p>
      <div class="acts">
        <button type="button" id="devprompt-cancel" class="cancel">Cancel</button>
        <button type="button" id="devprompt-go" class="primary">Log in</button>
      </div>
    </div>
  </div>

  <div id="updating" class="hidden">
    <div class="panel">
      <h2>Lakeside is updating…</h2>
      <p>Your progress is saved. Back in a moment.</p>
    </div>
  </div>

  <div id="toast"></div>
  <div id="tip" class="hidden"></div>
  <div id="resume" class="hidden"></div>
  <div id="menu" class="hidden">
    <div class="win">
      <header class="win-bar">
        <div class="who" id="menu-who"></div>
        <nav class="tabs" id="menu-tabs"></nav>
        <button class="close" data-act="close" title="Close (Esc)"><kbd>Esc</kbd><span class="x">✕</span></button>
      </header>
      <div id="tab" class="sheet"></div>
    </div>
  </div>

  <!-- The home screen (src/game/home.ts): up from the first paint, over a still of the lake. The class is its view:
       "loading" until the script picks one of "new" (create an account), "login" or "in" (logged in: Play). -->
  <div id="join" class="loading">
    <div id="join-card" class="panel join">
      <header class="join-head">
        <h1>Lakeside</h1>
        <p>Cozy fishing with friends</p>
      </header>
      <p class="join-wait">Loading…</p>
      <div class="join-tabs">
        <button type="button" data-join="new">New angler</button>
        <button type="button" data-join="login">I have an account</button>
      </div>
      <div class="split">
        <div id="join-preview"></div>
        <div class="grow">
          <form id="join-new" novalidate>
            <div class="fld">
              <label for="join-name">Name</label>
              <input id="join-name" name="username" maxlength="16" autocomplete="username" spellcheck="false" placeholder="Your name" />
            </div>
            <div class="fld">
              <label for="join-newpass">Password</label>
              <input id="join-newpass" name="new-password" type="password" maxlength="128" autocomplete="new-password" placeholder="6+ characters" />
            </div>
            <div class="fld wide">
              <label id="join-colors-label">Body color</label>
              <div id="join-colors" class="swatches" role="group" aria-labelledby="join-colors-label"></div>
            </div>
          </form>
          <form id="join-login" novalidate>
            <div class="fld">
              <label for="join-login-name">Name</label>
              <input id="join-login-name" name="username" maxlength="16" autocomplete="username" spellcheck="false" placeholder="Your name" />
            </div>
            <div class="fld">
              <label for="join-pass">Password</label>
              <input id="join-pass" name="password" type="password" maxlength="128" autocomplete="current-password" placeholder="Your password" />
            </div>
          </form>
          <div id="join-in"></div>
          <div id="join-confirm"></div>
          <p id="join-msg" class="joinmsg" role="status"></p>
          <button id="join-go" class="primary" type="submit" form="join-new">Create account</button>
          <button id="join-login-go" class="primary" type="submit" form="join-login">Log in</button>
          <button id="join-play" class="primary" type="button" disabled>Connecting…</button>
          <button id="join-other" class="linklike hidden" type="button" data-join="switch"></button>
        </div>
      </div>
      <footer class="join-foot">
        <button id="join-news" type="button" data-join="news">📰 What's new<b id="join-unread" class="hidden"></b></button>
        <button id="join-offline" class="linklike" type="button">or play offline</button>
      </footer>
    </div>
    <!-- The "What's new" board (homeBoardHtml), in place of the card until "Back". -->
    <div id="join-board" class="panel join"></div>
    <!-- A phone's first visit: add to the Home Screen first? (homeJoinHtml, src/game/homescreen.ts), in place of the card. -->
    <div id="join-home" class="panel join"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <!-- The start-error panel: filled in and shown by showStartError (src/main.ts) when the game can't start. -->
  <div id="desktop-only">
    <div class="panel"></div>
  </div>
  <!-- Touch mode on an upright phone: the game plays in landscape. -->
  <div id="rotate"><div><b>↻</b>Turn your phone sideways<small>Lakeside plays in landscape</small></div></div>
</body>
</html>
