services:
  - type: web
    name: browser-fishing
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_JOINS_WEBHOOK
        sync: false
      - key: DISCORD_FEEDBACK_WEBHOOK
        sync: false
      - key: DISCORD_FEEDBACK_TAGS
        sync: false
      - key: KOFI_VERIFY_TOKEN
        sync: false
      - key: DISCORD_TIPS_WEBHOOK
        sync: false
